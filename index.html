<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Content Planner & Studio</title>
    <!-- iOS Web App & Home Screen Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ContentPlanner">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2339d353'/%3E%3Cpath d='M7 10h10M7 14h6' stroke='%23000' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#000000',
                            800: '#0d1117',
                            700: '#161b22',
                            600: '#21262d',
                            500: '#30363d',
                            400: '#8b949e',
                        },
                        github: {
                            0: '#161b22',
                            1: '#0e4429',
                            2: '#006d32',
                            3: '#26a641',
                            4: '#39d353'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    </style>
</head>
<body class="h-screen overflow-hidden bg-black text-white font-sans antialiased" x-data="contentPlannerApp()" x-init="initApp()">

    <!-- Header (Transparent & Floating) -->
    <header class="fixed top-0 left-0 right-0 z-40 bg-transparent px-4 flex items-center justify-between" style="padding-top: env(safe-area-inset-top, 0px); height: calc(env(safe-area-inset-top, 0px) + 48px);">
        <div class="flex items-center space-x-2">
            <template x-if="currentScreen !== 'platforms'">
                <button @click="navigateBack()" class="text-zinc-300 bg-[#161b22]/80 hover:bg-[#21262d] border border-[#30363d] transition p-2 rounded-full shadow-lg active:scale-95">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>
            </template>
        </div>
        <div class="flex items-center space-x-2">
            <template x-if="currentScreen === 'platforms'">
                <button @click="openSettingsModal = true" class="text-zinc-300 bg-[#161b22]/80 hover:bg-[#21262d] border border-[#30363d] transition p-2 rounded-full shadow-lg active:scale-95" title="Настройки">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </button>
            </template>
            <template x-if="currentScreen === 'platform_detail'">
                <button @click="openSettingsModal = true" class="text-zinc-300 bg-[#161b22]/80 hover:bg-[#21262d] border border-[#30363d] transition p-2 rounded-full shadow-lg active:scale-95" title="Меню">
                    <i data-lucide="more-horizontal" class="w-5 h-5"></i>
                </button>
            </template>
        </div>
    </header>

    <!-- Main Content Area (Scrollable with Blur Mask) -->
    <main class="fixed inset-0 overflow-y-auto -webkit-overflow-scrolling-touch"
          style="padding-top: calc(env(safe-area-inset-top, 0px) + 48px);
                 padding-bottom: env(safe-area-inset-bottom, 0px);
                 mask-image: linear-gradient(to bottom, transparent 0px, black 30px, black calc(100% - 30px), transparent 100%);
                 -webkit-mask-image: linear-gradient(to bottom, transparent 0px, black 30px, black calc(100% - 30px), transparent 100%);">
        <div class="max-w-md mx-auto px-4 space-y-5 pb-28">

        <!-- ================= SCREEN 1: PLATFORMS ================= -->
        <template x-if="currentScreen === 'platforms'">
            <div class="space-y-5 modal-enter">
                
                <!-- Platform Cards -->
                <div class="px-2 space-y-6">
                    <template x-for="p in platforms" :key="p.id">
                        <div class="space-y-2 habit-card">
                            <div @click="selectPlatform(p)" class="flex items-center justify-between px-1 cursor-pointer group relative">
                                <div class="flex items-center space-x-2">
                                    <span class="text-xs font-bold text-white group-hover:text-emerald-400 transition" x-text="p.name"></span>
                                    <span class="text-xs text-zinc-500" x-show="getPlatformIdeasCount(p.id) > 0" x-text="'(' + getPlatformIdeasCount(p.id) + ')'"></span>
                                    <span 
                                        x-data="{ showMonthName: false, currentDisplayedMonth: '' }"
                                        x-init="
                                            const updateMonthDisplay = () => {
                                                const date = new Date(new Date().getFullYear(), new Date().getMonth() + (platformOffsets[p.id] || 0), 1);
                                                currentDisplayedMonth = formatDateMonthYear(date);
                                                showMonthName = true;
                                                clearTimeout(this._monthNameTimer);
                                                this._monthNameTimer = setTimeout(() => { showMonthName = false; }, 2000);
                                            };
                                            
                                            $watch('platformOffsets.' + p.id, updateMonthDisplay);
                                        "
                                        x-show="showMonthName" 
                                        x-transition:enter="transition ease-out duration-300" 
                                        x-transition:enter-start="opacity-0 translate-y-1" 
                                        x-transition:enter-end="opacity-100 translate-y-0"
                                        x-transition:leave="transition ease-in duration-300"
                                        x-transition:leave-end="opacity-0"
                                        class="text-[10px] text-zinc-500 font-medium whitespace-nowrap"
                                        x-text="currentDisplayedMonth"
                                    ></span>
                                </div>
                                <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-600 group-hover:text-white transition"></i>
                            </div>

                            <div class="relative overflow-visible p-0.5" 
                                 x-data="{ direction: 0 }" 
                                 @touchstart="handleTouchStart($event)" 
                                 @touchend="handleTouchEnd($event, p.id, direction)">
                                <div 
                                    :key="p.id + '-' + (platformOffsets[p.id] || 0)" 
                                    x-transition:enter="transform ease-out duration-300" 
                                    :x-transition:enter-start="direction === 1 ? 'translate-x-full' : '-translate-x-full'" 
                                    x-transition:enter-end="translate-x-0"
                                    x-transition:leave="transform ease-in duration-300 absolute w-full top-0 left-0"
                                    :x-transition:leave-end="direction === 1 ? '-translate-x-full' : 'translate-x-full'"
                                    class="grid grid-cols-12 gap-1.5 habit-heatmap-grid"
                                >
                                    <template x-for="cell in getMonthGrid(p.id)" :key="cell.dateStr">
                                        <div @click="selectPlatform(p); platformTab = 'calendar'; scheduleDateInput = cell.dateStr"
                                             class="aspect-square rounded-[3px] cursor-pointer transition active:scale-90"
                                             :class="[getColorClass(cell.intensity), cell.isNextMonth ? 'opacity-55' : '', isToday(cell.dateStr) ? 'ring-1 ring-white' : '']"
                                             :title="cell.dateStr">
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>



            </div>
        </template>


        <!-- ================= SCREEN 2: PLATFORM DETAIL ================= -->
        <template x-if="currentScreen === 'platform_detail' && activePlatform">
            <div class="space-y-4 modal-enter">

                <!-- Calendar Heatmap (Removed from here, moved to main list) -->

                <!-- Tabs: Bank of Ideas / Calendar / Archive -->
                <div class="flex items-center space-x-4">
                    <button @click="platformTab = 'ideas'" :class="platformTab === 'ideas' ? 'text-white font-bold' : 'text-zinc-500'" class="text-xs transition">
                        Идеи (<span x-text="platformIdeas.length"></span>)
                    </button>
                    <button @click="platformTab = 'calendar'" :class="platformTab === 'calendar' ? 'text-white font-bold' : 'text-zinc-500'" class="text-xs transition">
                        План
                    </button>
                    <button @click="platformTab = 'archive'" :class="platformTab === 'archive' ? 'text-white font-bold' : 'text-zinc-500'" class="text-xs transition">
                        Архив
                    </button>
                </div>

                <!-- TAB 1: IDEAS BANK -->
                <template x-if="platformTab === 'ideas'">
                    <div class="space-y-3">
                        <div class="space-y-2.5">
                            <template x-for="post in platformIdeas" :key="post.id">
                                <div class="p-4 rounded-2xl border border-[#30363d] space-y-3 relative" x-data="{ openMenu: false, openStatusDropdown: false }">
                                    <div class="pr-7">
                                        <div class="space-y-1.5 min-w-0">
                                            
                                            <template x-if="post.scheduledDate">
                                                <div class="flex items-center space-x-1 text-[10px] font-bold text-zinc-500 pb-1">
                                                    <i data-lucide="clock" class="w-3 h-3"></i>
                                                    <span x-text="formatDateHumanTime(post.scheduledDate, post.scheduledTime || '00:00')"></span>
                                                </div>
                                            </template>

                                            <div class="flex items-center space-x-2 flex-wrap gap-y-1 pb-1">
                                                <!-- Status Dropdown Selector -->
                                                <div class="relative">
                                                    <button @click="openStatusDropdown = !openStatusDropdown" 
                                                            class="px-2 py-0.5 rounded-md text-[10px] font-bold border flex items-center space-x-1 transition active:scale-95 cursor-pointer"
                                                            :class="getStatusBadgeClass(post.status)">
                                                        <span x-text="getStatusLabel(post.status)"></span>
                                                        <i data-lucide="chevron-down" class="w-3 h-3"></i>
                                                    </button>
                                                    <!-- Status Menu -->
                                                    <div x-show="openStatusDropdown" @click.away="openStatusDropdown = false" class="absolute left-0 mt-1 w-52 bg-[#161b22] border border-[#30363d] rounded-xl shadow-2xl p-1 z-50 modal-enter" x-cloak>
                                                        <button @click="setPostStatus(post, 'idea'); openStatusDropdown = false" class="w-full text-left px-2.5 py-1.5 rounded-lg text-xs text-zinc-300 hover:bg-[#21262d] flex items-center space-x-2">
                                                            <span class="w-2 h-2 rounded-full bg-zinc-400"></span>
                                                            <span>Идея</span>
                                                        </button>
                                                        <button @click="setPostStatus(post, 'scheduled'); openStatusDropdown = false" class="w-full text-left px-2.5 py-1.5 rounded-lg text-xs text-pink-400 hover:bg-[#21262d] flex items-center space-x-2">
                                                            <span class="w-2 h-2 rounded-full bg-pink-500"></span>
                                                            <span>Отложено</span>
                                                        </button>
                                                        <button @click="setPostStatus(post, 'results_pending'); openStatusDropdown = false" class="w-full text-left px-2.5 py-1.5 rounded-lg text-xs text-amber-400 hover:bg-[#21262d] flex items-center space-x-2">
                                                            <span class="w-2 h-2 rounded-full bg-amber-400"></span>
                                                            <span>Ждем результаты</span>
                                                        </button>
                                                        <button @click="setPostStatus(post, 'published'); openStatusDropdown = false" class="w-full text-left px-2.5 py-1.5 rounded-lg text-xs text-emerald-400 hover:bg-[#21262d] flex items-center space-x-2">
                                                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                                                            <span>Опубликовано</span>
                                                        </button>
                                                    </div>
                                                </div>

                                                <span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-[#21262d] text-zinc-400 border border-[#30363d]" x-text="getFormatName(post.formatId)"></span>
                                            </div>
                                            
                                            <div class="flex items-baseline justify-between gap-2">
                                                <h3 class="text-sm font-bold text-white flex-1 leading-snug" x-text="post.title || 'Без названия'"></h3>
                                                <span class="text-[10px] text-zinc-500 whitespace-nowrap font-medium" x-text="formatTelegramDate(post.createdAt)"></span>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="absolute top-3 right-2">
                                        <button @click="openMenu = !openMenu" class="p-2 text-zinc-400 hover:text-white transition">
                                            <i data-lucide="more-vertical" class="w-5 h-5"></i>
                                        </button>
                                        <div x-show="openMenu" @click.away="openMenu = false" class="absolute right-0 mt-1 w-52 bg-[#161b22] border border-[#30363d] rounded-2xl shadow-2xl p-1.5 z-50 modal-enter" x-cloak>
                                            <button @click="editPost(post); openMenu = false" class="w-full flex items-center space-x-2.5 px-3 py-2 rounded-xl text-xs text-zinc-300 hover:bg-[#21262d] hover:text-white transition">
                                                <i data-lucide="edit-3" class="w-3.5 h-3.5 opacity-60"></i>
                                                <span>Редактировать</span>
                                            </button>
                                            <button @click="duplicatePost(post); openMenu = false" class="w-full flex items-center space-x-2.5 px-3 py-2 rounded-xl text-xs text-zinc-300 hover:bg-[#21262d] hover:text-white transition">
                                                <i data-lucide="clipboard" class="w-3.5 h-3.5 opacity-60"></i>
                                                <span>Дублировать</span>
                                            </button>
                                            <button @click="schedulePostModal(post); openMenu = false" class="w-full flex items-center space-x-2.5 px-3 py-2 rounded-xl text-xs text-zinc-300 hover:bg-[#21262d] hover:text-white transition">
                                                <i data-lucide="calendar" class="w-3.5 h-3.5 opacity-60"></i>
                                                <span>Запланировать</span>
                                            </button>
                                            <button @click="
                    const text = getStitchedPostText(post);
                    navigator.clipboard.writeText(text).then(() => {
                        // анимируем или тихо копируем
                    });
                    openMenu = false;
                " class="w-full flex items-center space-x-2.5 px-3 py-2 rounded-xl text-xs text-zinc-300 hover:bg-[#21262d] hover:text-white transition">
                                                <i data-lucide="copy" class="w-3.5 h-3.5 opacity-60"></i>
                                                <span>Копировать пост</span>
                                            </button>
                                            <button @click="copyGptPromptForPost(post); openMenu = false" class="w-full flex items-center space-x-2.5 px-3 py-2 rounded-xl text-xs text-zinc-300 hover:bg-[#21262d] hover:text-white transition">
                                                <i data-lucide="cpu" class="w-3.5 h-3.5 opacity-60"></i>
                                                <span>Промпт для GPT</span>
                                            </button>
                                            <div class="border-t border-[#30363d] my-1"></div>
                                            <button @click="deletePost(post.id); openMenu = false" class="w-full flex items-center space-x-2.5 px-3 py-2 rounded-xl text-xs text-red-400/80 hover:bg-red-500/10 hover:text-red-400 transition">
                                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                                <span>Удалить</span>
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Blocks preview summary -->
                                    <div class="space-y-2">
                                        <template x-for="(val, blockKey) in post.blocks" :key="blockKey">
                                            <div class="text-xs" x-show="val && val.trim().length > 0">
                                                <span class="font-bold text-zinc-500 mr-1.5" x-text="getBlockLabel(post.formatId, blockKey) + ':'"></span>
                                                <span class="text-zinc-300" x-text="val"></span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>


                <!-- TAB 2: CALENDAR / SCHEDULE -->
                <template x-if="platformTab === 'calendar'">
                    <div class="space-y-4">
                        <div class="p-4 rounded-2xl bg-[#161b22] border border-[#30363d] space-y-3">
                            <div class="flex items-center justify-between">
                                <h3 class="text-sm font-bold text-white">Контент-календарь на неделю</h3>
                                <div class="flex items-center space-x-1 text-xs text-zinc-400">
                                    <button @click="shiftWeek(-1)" class="p-1 rounded bg-[#21262d] hover:text-white"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                                    <span class="font-bold text-white px-2" x-text="currentWeekLabel"></span>
                                    <button @click="shiftWeek(1)" class="p-1 rounded bg-[#21262d] hover:text-white"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-7 gap-2">
                                <template x-for="day in currentWeekDays" :key="day.dateStr">
                                    <div class="p-3 rounded-xl bg-[#0d1117] border border-[#30363d] space-y-2 min-h-[120px] flex flex-col justify-between">
                                        <div>
                                            <div class="flex items-center justify-between">
                                                <span class="text-[10px] font-bold uppercase text-zinc-400" x-text="day.dayName"></span>
                                                <span class="text-xs font-extrabold text-white" :class="day.isToday ? 'text-emerald-400' : ''" x-text="day.dayNum"></span>
                                            </div>
                                            <div class="mt-2 space-y-1.5">
                                                <template x-for="post in getPostsForDate(day.dateStr)" :key="post.id">
                                                    <div @click="editPost(post)" class="p-2 rounded-lg bg-[#21262d] hover:bg-[#30363d] border border-[#30363d] cursor-pointer space-y-1">
                                                        <div class="text-[10px] text-cyan-400 font-bold truncate" x-text="getFormatName(post.formatId)"></div>
                                                        <div class="text-xs font-semibold text-white truncate" x-text="post.title || 'Пост'"></div>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                        <button @click="createPostForDate(day.dateStr)" class="w-full py-1 rounded bg-[#21262d] hover:bg-[#30363d] text-[10px] font-bold text-zinc-400 hover:text-white transition text-center">
                                            + План
                                        </button>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>


                <!-- TAB 3: ARCHIVE & RESULTS -->
                <template x-if="platformTab === 'archive'">
                    <div class="space-y-3">
                        <div class="text-xs font-bold text-zinc-400 uppercase tracking-wider px-1">Опубликованные посты и результаты</div>
                        
                        <template x-if="platformPublished.length === 0">
                            <div class="text-center py-12 px-4 rounded-2xl bg-[#161b22] border border-[#30363d] space-y-2">
                                <div class="text-xs text-zinc-400">Пока нет опубликованных постов. Запланируйте дату выхода поста!</div>
                            </div>
                        </template>

                        <div class="space-y-3">
                            <template x-for="post in platformPublished" :key="post.id">
                                <div class="p-4 rounded-2xl bg-[#161b22] border border-[#30363d] space-y-3">
                                     <div class="flex items-center justify-between">
                                         <div class="space-y-0.5 w-full">
                                              <div class="flex items-center justify-between">
                                                  <div class="flex items-center space-x-2">
                                                      <span class="px-2 py-0.5 rounded-md text-[10px] font-bold border" :class="getStatusBadgeClass(post.status)" x-text="getStatusLabel(post.status)"></span>
                                                      <span class="text-[10px] text-zinc-400" x-text="'План: ' + (post.scheduledDate || 'н/д') + (post.scheduledTime ? ' ' + post.scheduledTime : '')"></span>
                                                  </div>
                                              </div>
                                             <h3 class="text-sm font-bold text-white pt-1" x-text="post.title || 'Без названия'"></h3>
                                         </div>
                                     </div>

                                     <!-- Results Check Date Edit -->
                                     <div class="flex items-center justify-between py-1.5 px-2.5 rounded-xl bg-[#0d1117] border border-[#30363d] text-xs">
                                         <span class="text-zinc-400">Проверить результаты до/в:</span>
                                         <input type="date" 
                                                x-model="post.resultsCheckDate" 
                                                @change="checkPostStatuses(); saveData()" 
                                                class="bg-transparent text-amber-400 font-bold outline-none text-right text-xs cursor-pointer">
                                     </div>

                                    <!-- Results / Metrics Input Section -->
                                    <div class="space-y-0.5 pt-2">
                                        <template x-for="metric in ['Охват', 'Удержание', 'Подписки', 'Переходы', 'Обращения', 'Записи']" :key="metric">
                                            <div class="flex items-center justify-between py-1.5">
                                                <span class="text-xs text-zinc-400" x-text="metric"></span>
                                                <input type="number" 
                                                       x-model="post.results[metric]" 
                                                       @input="saveData()" 
                                                       placeholder="0" 
                                                       class="w-16 bg-transparent text-right text-xs font-bold text-white outline-none">
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

            </div>
        </template>

    </main>
    <div class="h-20"></div> <!-- Компенсация нижнего паддинга -->


    <!-- FLOATING ACTION BUTTON (FAB) IN BOTTOM RIGHT CORNER -->
    <template x-if="currentScreen === 'platform_detail'">
        <div class="fixed bottom-6 right-6 z-50" x-data="{ openAddMenu: false }">
            <!-- Popover menu -->
            <div x-show="openAddMenu" @click.away="openAddMenu = false" class="absolute bottom-16 right-0 w-60 bg-[#161b22] border border-[#30363d] rounded-2xl shadow-2xl p-1.5 space-y-1 modal-enter" x-cloak>
                <div @click="openNewPostModal(); openAddMenu = false" class="px-3 py-2.5 rounded-xl text-xs font-medium text-white hover:bg-[#21262d] cursor-pointer flex items-center space-x-2">
                    <i data-lucide="lightbulb" class="w-4 h-4 text-amber-400"></i>
                    <span>💡 Создать быструю идею</span>
                </div>
                <div class="border-t border-[#30363d] my-1"></div>
                <div class="px-3 py-1 text-[10px] font-bold text-zinc-500 uppercase tracking-wider">Создать по формату:</div>
                <template x-for="fmt in formats" :key="fmt.id">
                    <div @click="openNewPostModalForFormat(fmt.id); openAddMenu = false" class="px-3 py-2 rounded-xl text-xs font-medium text-zinc-300 hover:text-white hover:bg-[#21262d] cursor-pointer truncate" x-text="fmt.name"></div>
                </template>
            </div>

            <!-- Main FAB Button -->
            <button @click="openAddMenu = !openAddMenu" class="w-14 h-14 rounded-full bg-[#21262d] hover:bg-[#30363d] text-white border border-[#30363d] flex items-center justify-center shadow-2xl transition active:scale-95" title="Создать">
                <i data-lucide="plus" class="w-7 h-7"></i>
            </button>
        </div>
    </template>


    <!-- ================= MODAL: FORMATS MANAGER & CREATOR ================= -->
    <div x-show="openFormatsManager" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
        <div @click.away="openFormatsManager = false" class="w-full max-w-lg bg-[#161b22] border border-[#30363d] rounded-3xl p-5 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl modal-enter">
            <div class="flex items-center justify-between pb-2 border-b border-[#30363d]">
                <div class="flex items-center space-x-2">
                    <i data-lucide="layers" class="w-5 h-5 text-cyan-400"></i>
                    <h3 class="text-base font-bold text-white">Конструктор форматов постов</h3>
                </div>
                <button @click="openFormatsManager = false" class="p-1.5 rounded-xl bg-[#21262d] text-zinc-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>

            <p class="text-xs text-zinc-400 leading-relaxed">
                Добавьте блоки, из которых будет состоять пост.
            </p>

                isAnimating: false, // Флаг для блокировки свайпов во время анимации

                changeMonth(platformId, delta) {
                    if (this.isAnimating) return; // Блокируем свайп, если анимация активна
                    this.isAnimating = true;

                    const oldOffset = this.platformOffsets[platformId] || 0;
                    const newOffset = oldOffset + delta;
                    this.platformOffsets[platformId] = newOffset;
                    
                    // Разрешаем новый свайп после завершения анимации
                    setTimeout(() => {
                        this.isAnimating = false;
                    }, 300); // Длительность CSS-перехода
                },

                handleTouchStart(e) {
                    this.touchStartX = e.touches[0].clientX;
                },
                
                handleTouchEnd(e, platformId) {
                    let touchEndX = e.changedTouches[0].clientX;
                    let diff = this.touchStartX - touchEndX;
                    if (Math.abs(diff) > 50) { // Порог свайпа
                        if (diff > 0) this.changeMonth(platformId, 1); // Свайп влево -> следующий месяц
                        else this.changeMonth(platformId, -1); // Свайп вправо -> предыдущий месяц
                    }
                },

                getMonthGrid(platformId) {
                    let y = this.currentDate.getFullYear();
                    let m = this.currentDate.getMonth() + (this.platformOffsets[platformId] || 0);
                    
                    let firstDay = new Date(y, m, 1);
                    let lastDayOfMonth = new Date(y, m + 1, 0);
                    let daysCount = lastDayOfMonth.getDate();
                    
                    let list = [];
                    for (let i = 1; i <= daysCount; i++) {
                        let dateObj = new Date(y, m, i);
                        let dateStr = dateObj.toISOString().split('T')[0];
                        list.push({
                            dateStr: dateStr,
                            intensity: this.getIntensityForPlatform(platformId, dateStr),
                            isNextMonth: false
                        });
                    }
                    
                    let remaining = 36 - daysCount;
                    for (let j = 1; j <= remaining; j++) {
                        let nextDateObj = new Date(y, m + 1, j);
                        let nextDateStr = nextDateObj.toISOString().split('T')[0];
                        list.push({
                            dateStr: nextDateStr,
                            intensity: this.getIntensityForPlatform(platformId, nextDateStr),
                            isNextMonth: true
                        });
                    }
                    return list;
                },

                getIntensity(dateStr) {
                    if (!this.activePlatform) return 0;
                    return this.getIntensityForPlatform(this.activePlatform.id, dateStr);
                },

                formatDateHumanTime(dateStr, timeStr) {
                    if (!dateStr) return '';
                    const date = new Date(dateStr);
                    const now = new Date();
                    
                    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    const tomorrow = new Date(today);
                    tomorrow.setDate(tomorrow.getDate() + 1);
                    const dayAfterTomorrow = new Date(today);
                    dayAfterTomorrow.setDate(dayAfterTomorrow.getDate() + 2);
                    
                    const dateOnly = new Date(date.getFullYear(), date.getMonth(), date.getDate());
                    
                    let dayName = '';
                    if (dateOnly.getTime() === today.getTime()) {
                        dayName = 'сегодня';
                    } else if (dateOnly.getTime() === tomorrow.getTime()) {
                        dayName = 'завтра';
                    } else if (dateOnly.getTime() === dayAfterTomorrow.getTime()) {
                        dayName = 'послезавтра';
                    } else {
                        dayName = date.toLocaleDateString('ru-RU', { weekday: 'long' });
                    }
                    
                    return `Публикация ${dayName} в ${timeStr}`;
                },

                getIntensityForPlatform(platformId, dateStr) {
                    const postsOnDate = this.posts.filter(p => p.platformId === platformId && p.scheduledDate === dateStr);
                    if (postsOnDate.length === 0) return 0;

                    // Если есть пост, который запланирован на сегодня или будущее, он в приоритете (розовый)
                    if (postsOnDate.some(p => p.status === 'scheduled')) return 2; 
                    
                    if (postsOnDate.some(p => p.status === 'published')) return 4; // Зеленый
                    if (postsOnDate.some(p => p.status === 'results_pending')) return 3; // Желтый
                    return 1; // Серый (Идея)
                },

                isToday(dateStr) {
                    if (!dateStr) return false;
                    const now = new Date();
                    const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                    return dateStr === todayStr;
                },

                getColorClass(intensity) {
                    if (intensity === 4) return 'bg-github-4';
                    if (intensity === 3) return 'bg-github-3';
                    if (intensity === 2) return 'bg-pink-500';
                    if (intensity === 1) return 'bg-github-1';
                    return 'bg-github-0';
                },

                getStatusBadgeClass(status) {
                    if (status === 'published') return 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30';
                    if (status === 'results_pending') return 'bg-amber-400/15 text-amber-400 border-amber-400/30';
                    if (status === 'scheduled') return 'bg-pink-500/15 text-pink-400 border-pink-500/30';
                    return 'bg-zinc-800/80 text-zinc-400 border-zinc-700';
                },

                getStatusLabel(status) {
                    if (status === 'published') return 'Опубликовано';
                    if (status === 'results_pending') return 'Ждем результаты';
                    if (status === 'scheduled') return 'Отложено';
                    return 'Идея';
                },

                setPostStatus(post, newStatus) {
                    post.status = newStatus;
                    if ((newStatus === 'scheduled' || newStatus === 'published' || newStatus === 'results_pending') && !post.scheduledDate) {
                        this.schedulePostModal(post);
                    } else if (newStatus === 'idea') {
                        post.scheduledDate = '';
                        post.resultsCheckDate = '';
                        this.checkPostStatuses();
                        this.saveData();
                    } else {
                        this.checkPostStatuses();
                        this.saveData();
                    }
                },

                checkPostStatuses() {
                    const now = new Date();
                    
                    this.posts.forEach(post => {
                        if (!post.scheduledDate) return;
                        
                        const postDateTime = new Date(post.scheduledDate + 'T' + (post.scheduledTime || '00:00'));
                        
                        // Если пост запланирован и время наступило -> Опубликовано (Зеленый)
                        if (post.status === 'scheduled' && now >= postDateTime) {
                            post.status = 'published';
                            
                            // Авто-установка даты проверки результатов (через 7 дней)
                            if (!post.resultsCheckDate) {
                                const schedDate = new Date(post.scheduledDate);
                                schedDate.setDate(schedDate.getDate() + 7);
                                post.resultsCheckDate = `${schedDate.getFullYear()}-${String(schedDate.getMonth() + 1).padStart(2, '0')}-${String(schedDate.getDate()).padStart(2, '0')}`;
                            }
                        }
                        
                        // Если опубликован и наступил день проверки результатов — статус "Ждем результаты" (Желтый)
                        if (post.status === 'published' && post.resultsCheckDate) {
                            const checkDateTime = new Date(post.resultsCheckDate + 'T00:00:00');
                            if (now >= checkDateTime) {
                                post.status = 'results_pending';
                            }
                        }
                    });
                    this.saveData();
                },

                    if (post.title) {

                    for (let b of fmt.blocks) {
                        let val = post.blocks[b.key];
                        if (val && val.trim()) {

                    const end = new Date(start);
                    end.setDate(end.getDate() + 6);
                    return `${start.getDate()} ${this.getMonthName(start)} - ${end.getDate()} ${this.getMonthName(end)}`;
                },

                get currentWeekDays() {
                    const start = this.getStartOfWeek(this.weekOffset);
                    let days = [];
                    const todayStr = new Date().toISOString().split('T')[0];
                    const dayNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

                    for (let i = 0; i < 7; i++) {
                        let d = new Date(start);
                        d.setDate(d.getDate() + i);
                        let dateStr = d.toISOString().split('T')[0];
                        days.push({
                            dayName: dayNames[i],
                            dayNum: d.getDate(),
                            dateStr: dateStr,
                            isToday: dateStr === todayStr
                        });
                    }
                    return days;
                },

                getStartOfWeek(offsetWeeks) {
                    let d = new Date();
                    let day = d.getDay();
                    let diff = d.getDate() - day + (day === 0 ? -6 : 1);
                    let monday = new Date(d.setDate(diff));
                    monday.setDate(monday.getDate() + (offsetWeeks * 7));
                    monday.setHours(0,0,0,0);
                    return monday;
                },

                getMonthName(date) {
                    const months = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
                    return months[date.getMonth()];
                },

                getPostsForDate(dateStr) {
                    if (!this.activePlatform) return [];
                    return this.posts.filter(p => p.platformId === this.activePlatform.id && p.scheduledDate === dateStr);
                },

                formatTelegramDate(isoStr) {
                    if (!isoStr) return '';
                    const date = new Date(isoStr);
                    const now = new Date();
                    
                    const diffMs = now - date;
                    const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                    
                    // Сегодня: время
                    if (diffDays === 0) {
                        return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                    }
                    // Вчера: 'вчера'
                    if (diffDays === 1) {
                        return 'вчера';
                    }
                    // Неделя: день недели (сб, вс, пн)
                    if (diffDays < 7) {
                        return date.toLocaleDateString('ru-RU', { weekday: 'short' });
                    }
                    // Старее: 08.11
                    return date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
                },

                formatDateMonthYear(date) {
                    const options = { year: 'numeric', month: 'long' };
                    return date.toLocaleDateString('ru-RU', options);
                },

                saveGithubSettings() {
                    localStorage.setItem('cp_github_token', this.githubToken.trim());
                    localStorage.setItem('cp_gist_id', this.gistId.trim());
                    alert('Настройки GitHub сохранены!');
                    this.openSettingsModal = false;
                    this.syncWithGist();
                },

                async syncWithGist() {
                    if (!this.githubToken) return;
                    this.syncStatus = 'syncing';
                    try {
                        if (!this.gistId) {
                            let res = await fetch('https://api.github.com/gists', {
                                headers: { 'Authorization': `token ${this.githubToken}` }
                            });
                            if (res.ok) {
                                let gists = await res.json();
                                let existing = gists.find(g => g.description === 'ContentPlannerData');
                                if (existing) {
                                    this.gistId = existing.id;
                                    localStorage.setItem('cp_gist_id', this.gistId);
                                }
                            }
                        }

                        const payload = {
                            platforms: this.platforms,
                            formats: this.formats,
                            posts: this.posts,
                            updatedAt: new Date().toISOString()
                        };

                        if (this.gistId) {
                            let res = await fetch(`https://api.github.com/gists/${this.gistId}`, {
                                method: 'PATCH',
                                headers: {
                                    'Authorization': `token ${this.githubToken}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    description: 'ContentPlannerData',
                                    files: {
                                        'content_plan.json': {
                                            content: JSON.stringify(payload, null, 2)
                                        }
                                    }
                                })
                            });
                            if (res.ok) {
                                this.syncStatus = 'synced';
                            } else {
                                this.syncStatus = 'error';
                            }
                        } else {
                            let res = await fetch('https://api.github.com/gists', {
                                method: 'POST',
                                headers: {
                                    'Authorization': `token ${this.githubToken}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    description: 'ContentPlannerData',
                                    public: false,
                                    files: {
                                        'content_plan.json': {
                                            content: JSON.stringify(payload, null, 2)
                                        }
                                    }
                                })
                            });
                            if (res.ok) {
                                let data = await res.json();
                                this.gistId = data.id;
                                localStorage.setItem('cp_gist_id', this.gistId);
                                this.syncStatus = 'synced';
                            } else {
                                this.syncStatus = 'error';
                            }
                        }
                    } catch (e) {
                        this.syncStatus = 'error';
                    }
                },

                exportMarkdownBackup() {
                    let md = `# Контент План и Студия\n\nЭкспорт от ${new Date().toLocaleDateString()}\n\n`;
                    for (let p of this.platforms) {
                        md += `## Площадка: ${p.name}\n\n`;
                        const pPosts = this.posts.filter(x => x.platformId === p.id);
                        for (let post of pPosts) {
                            md += `### ${post.title || 'Без названия'} (${post.scheduledDate ? 'Дата: ' + post.scheduledDate : 'Идея'})\n`;
                            const fmt = this.formats.find(f => f.id === post.formatId);
                            if (fmt) {
                                for (let b of fmt.blocks) {
                                    if (post.blocks[b.key]) {
                                        md += `**${b.label}:**\n${post.blocks[b.key]}\n\n`;
                                    }
                                }
                            }
                            md += `---\n\n`;
                        }
                    }

                    const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `content_plan_${new Date().toISOString().split('T')[0]}.md`;
                    a.click();
                },

                exportJsonBackup() {
                    const data = {
                        platforms: this.platforms,
                        formats: this.formats,
                        posts: this.posts
                    };
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `content_planner_backup_${new Date().toISOString().split('T')[0]}.json`;
                    a.click();
                }
            }
        }
    </script>
